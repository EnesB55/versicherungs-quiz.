      color: #065f46 !important;

    }

    .option-btn.wrong {
      border-color: #dc2626 !important;
      background: #fee2e2 !important;
      color: #991b1b !important;
    }

      padding: 14px;
      border-radius: 12px;
      font-size: 0.9rem;
      line-height: 1.4;
      margin-bottom: 16px;
      display: none;

      background: #dcfce7;
      color: #065f46;
      border: 1px solid #86efac;
    }
